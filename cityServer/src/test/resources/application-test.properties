spring.application.name=city

spring.datasource.generate-unique-name=false
spring.datasource.name=testdb

spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password

spring.jpa.open-in-view=true
spring.jpa.hibernate.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.liquibase.change-log=classpath:/db/changelog/changelog-master-test.xml

cityserver.passportservice.pasport-series=4606
cityserver.passportservice.office-code=053-249

eureka.client.enabled=false
spring.cloud.discovery.enabled=false

citydatabase.kafka.enabled=false
